# 文件用途：定义“统计事件消费者”的数据语义、权威存储、写入顺序、对账策略和上线验收门槛。
# 消费目标：统计 video.reviewed、video.published 和 video.deleted 等领域事件的累计发生次数。
# 数据边界：ClickHouse 保存可精确去重的权威事件，Redis 保存按 generation 和 shard 拆分的快速读取投影。
# 重要说明：这是生产启用契约和验收清单，不是程序直接加载的运行配置；修改本文件不会启动消费者。
# 实际开关位于 config/{debug,pre,prod}/kafka.yaml 的 kafka.business.consumers.statistic.enabled。

# 契约版本。值为 1 表示当前文件采用第一版统计消费者上线规则；修改语义不兼容时应升级版本。
version: 1

# 消费者名称。statistic 对应代码中的统计 Kafka consumer，并用于和 feed、search、audit 区分。
consumer: statistic

# 当前上线状态：预发布环境验收完成前保持禁用，不得仅因本地测试通过就开启预发布或生产配置。
status: disabled_until_pre_acceptance

# semantics 定义统计值“统计什么、以谁为准、如何快速读取以及怎样抵御重复消息”。
semantics:
  # 指标含义：按领域事件名称累计事件发生次数，不代表去重用户数、视频存量或实时在线数量。
  metric: cumulative_domain_event_count

  # 权威数据源：ClickHouse 的 mlc.statistic_events 表保存事件明细，故障排查和重建 Redis 均以它为准。
  authority: clickhouse.statistic_events

  # 快速投影：Redis 使用多个分片 Hash 保存累计值，避免所有写入集中到一个全局热 key。
  fast_projection: redis_sharded_hash

  # Kafka 至少一次投递：消息可能重复到达，但成功处理的消息不应丢失；消费者必须实现幂等。
  delivery: at_least_once

  # ClickHouse 聚合时按 event_id 做精确去重，同一事件因 Kafka 重试写入多次也只累计一次。
  authority_deduplication: uniqExact(event_id)

# write_order 定义每条 Kafka 消息必须严格遵守的处理顺序；前一步失败时不能继续提交 offset。
write_order:
  # 第一步：写入 ClickHouse 并收到成功确认，先保证权威事件可追溯和可用于重建。
  - clickhouse_acknowledged_insert
  # 第二步：通过 Redis Lua 原子完成 EventID/offset 幂等判断和分片计数投影。
  - redis_atomic_projection
  # 第三步：只有 ClickHouse 和 Redis 都成功后才提交 Kafka offset，标记该消息已处理。
  - kafka_offset_commit

# reconciliation 定义如何比较 ClickHouse 权威累计值与 Redis 快速投影，发现数据漂移。
reconciliation:
  # detect_only 表示对账器只读取、比较、记录指标和触发告警，不直接修改 Redis。
  mode: detect_only

  # 明确禁止自动用 ClickHouse 结果覆盖正在提供服务的 Redis 数据。
  automatic_redis_overwrite: forbidden

  # 禁止在线覆盖的原因：读取 ClickHouse 后到写回 Redis 前仍可能有新事件并发累加，直接覆盖会丢失增量。
  reason: online overwrite can lose concurrent increments

  # repair_runbook 是发现持续漂移后的人工修复顺序，必须按顺序执行以避免继续产生不一致。
  repair_runbook:
    # 暂停统计消费者，冻结新的 ClickHouse/Redis 投影写入，建立一致的重建边界。
    - pause_statistic_consumer
    # 从 ClickHouse 权威事件为一个新的 Redis generation 构建全部分片和事件计数。
    - build_new_redis_generation_from_clickhouse
    # 校验新 generation 与 ClickHouse 的累计结果一致，并检查 key 数、分片数和异常值。
    - verify_new_generation
    # 原子或受控地把应用配置切换到新 generation，旧 generation 暂时保留用于回滚。
    - switch_generation_configuration
    # 确认读写都指向新 generation 后恢复消费者，继续处理 Kafka 消息。
    - resume_consumer

# production_gates 是启用预发布或生产统计消费者前必须全部验证通过的门槛。
production_gates:
  # ClickHouse 数据库、事件明细表、聚合表和物化视图已经执行建表脚本并核对结构。
  - clickhouse_schema_applied
  # ClickHouse 连接启用正确的 TLS 校验，账号密码等凭据由 Secret 注入且满足最小权限。
  - clickhouse_tls_and_secret_configured
  # 在预发布持续对账期间没有未恢复的数据漂移，不能只看某一次瞬时结果为零。
  - pre_environment_reconciliation_has_zero_sustained_drift
  # 已通过故障演练确认 ClickHouse 写入失败指标和告警能够触发、通知并在恢复后关闭。
  - clickhouse_write_failure_alert_verified
  # 已确认长时间没有成功对账时，reconciliation staleness 告警能够正确触发和通知。
  - reconciliation_staleness_alert_verified
  # 已确认 Kafka 消费积压达到阈值时 lag 告警能够正确触发，避免消费者停滞但无人发现。
  - kafka_consumer_lag_alert_verified

# acceptance 描述本地验收命令、覆盖范围，以及本地通过与生产批准之间的边界。
acceptance:
  # 在仓库根目录执行该命令，运行统计链路集成验收测试。
  local_command: make statistic-acceptance

  # local_scope 列出本地验收必须实际覆盖的关键步骤，而不只是验证进程可以启动。
  local_scope:
    # 验证测试事件能够写入 Kafka，并被独立统计消费组读取。
    - kafka_produce_and_consume
    # 验证消费到的事件写入 ClickHouse 权威明细存储并收到成功确认。
    - clickhouse_authority_insert
    # 验证 Redis 投影通过原子操作去重并更新正确 generation、shard 和事件维度。
    - redis_atomic_projection
    # 验证前述写入全部成功后才提交 Kafka offset，失败时不会提前确认消息。
    - kafka_offset_commit
    # 验证 ClickHouse 精确去重累计值与 Redis 投影对账结果为零漂移。
    - zero_drift_reconciliation

  # true 表示本地验收通过不等于预发布审批通过，不能据此直接修改预发布开关。
  local_acceptance_is_not_pre_approval: true

  # 启用策略：必须先验证全部 production_gates，之后才允许开启预发布 statistic 配置。
  pre_enablement_policy: all_production_gates_must_be_verified_before_enabling_config_pre_statistic
