global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [service, environment, component, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-webhook
      repeat_interval: 30m

inhibit_rules:
  - source_matchers:
      - alertname="MLCKafkaTargetDown"
    target_matchers:
      - severity=~"warning|info"
    equal: [service, environment]

receivers:
  - name: default
  - name: critical-webhook
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
