global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: mlc-go
    metrics_path: /metrics
    static_configs:
      # 本地 compose 中应用运行在宿主机；生产环境应替换为服务发现，并仅访问管理网络。
      - targets: [host.docker.internal:9091]
        labels:
          service: mlc-go
          environment: local
          component: application
