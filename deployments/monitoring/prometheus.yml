# 用途：配置本地监控环境中的 Prometheus，加载 MLC 告警规则、转发告警并抓取应用管理指标。
# 说明：当前抓取目标适用于 Docker Compose；生产环境应改用受限管理网络中的服务发现。
global:
  # 指标抓取和规则计算保持相同周期，便于告警表达式按统一时间粒度评估。
  scrape_interval: 15s
  evaluation_interval: 15s

# 加载挂载到 Prometheus 容器中的全部 MLC 告警规则文件。
rule_files:
  - /etc/prometheus/rules/*.yml

# 将触发和恢复的告警发送给同一 Compose 网络中的 Alertmanager。
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # 抓取 mlc-go 独立管理端口，避免将 /metrics 暴露在业务端口或公网入口。
  - job_name: mlc-go
    metrics_path: /metrics
    static_configs:
      # 本地 compose 中应用运行在宿主机；生产环境应替换为服务发现，并仅访问管理网络。
      - targets: [host.docker.internal:9091]
        labels:
          service: mlc-go
          environment: local
          component: application

  # 低频抓取 broker 端 committed-offset lag，与应用进程内处理进度指标保持独立。
  - job_name: kafka-committed-offset-exporter
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      - targets: [kafka-committed-offset-exporter:9308]
        labels:
          service: mlc-kafka
          environment: local
          component: kafka-committed-offset
