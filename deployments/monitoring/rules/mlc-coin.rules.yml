groups:
  - name: mlc-coin-jobs
    rules:
      - alert: MLCCoinLotConsolidationFailures
        expr: increase(mlc_coin_job_runs_total{job="lot_consolidation",result="failure"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Lot consolidation is failing"
          description: "Pause the canary and inspect wallet lock waits, transaction duration, binlog growth, and replica lag."

      - alert: MLCCoinLotConsolidationNearTimeout
        expr: rate(mlc_coin_job_duration_nanoseconds_total{job="lot_consolidation"}[10m]) / clamp_min(rate(mlc_coin_job_runs_total{job="lot_consolidation",result="success"}[10m]), 0.001) > 15000000000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lot consolidation duration is approaching its timeout"
          description: "Average successful run duration exceeded 15 seconds; keep or reduce the canary batch."

      - alert: MLCOpsAssetAuditUnexpectedEventKeyConflicts
        expr: increase(mlc_ops_asset_audit_event_key_conflicts_total{source="ops_api"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Asset audit event keys are colliding outside correction recovery"
          description: "Inspect request ID reuse and caller retry behavior. Expected duplicate audit writes should originate from correction_recovery."
