services:
  # 本文件用于本地开发启动一套 3 节点 Kafka KRaft 集群。
  # 访问方式：本机 Go 服务使用 localhost:19092,localhost:29092,localhost:39092；compose 网络内服务使用 kafka-1:9092,kafka-2:9092,kafka-3:9092。
  # 注意：这是开发环境配置，生产环境必须补齐鉴权、TLS、磁盘容量、监控告警和显式 topic 初始化。

  # Kafka broker/controller 节点 1。
  # 本地通过 localhost:19092 访问；容器网络内通过 kafka-1:9092 访问。
  kafka-1:
    image: apache/kafka:3.7.1
    container_name: mlc-kafka-1
    ports:
      # 宿主机端口:容器端口；Go 服务在本机运行时使用 localhost:19092。
      - "19092:19092"
    environment:
      # 使用 KRaft 模式，不再依赖 ZooKeeper。
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # 每个 KRaft 节点必须有唯一 node id。
      KAFKA_NODE_ID: 1
      # broker 负责读写消息，controller 负责集群元数据选主和管理。
      KAFKA_PROCESS_ROLES: broker,controller
      # 三节点 controller quorum；格式为 nodeId@host:controllerPort。
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      # 9092 对外提供普通 Kafka 协议，9093 仅供 controller quorum 内部通信。
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      # 对宿主机客户端暴露的 broker 地址，必须使用宿主机可访问地址。
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
      # 本地开发使用明文协议；生产环境应替换为 SASL_SSL/SSL。
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 指定 controller 监听器名称，必须与 LISTENERS 中的 CONTROLLER 一致。
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 本地开发允许自动建 topic，生产环境建议关闭并用迁移脚本显式创建。
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # consumer offset topic 副本数设为 3，保证任意单节点故障后仍可恢复消费位点。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      # 事务状态 topic 副本数设为 3；未来启用事务消息时需要该配置。
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      # 事务状态最小 ISR 为 2，三节点集群允许损失 1 个副本仍可用。
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    volumes:
      # 持久化 broker 数据，避免容器重启后 topic 和 offset 丢失。
      - kafka_1_data:/var/lib/kafka/data

  # Kafka broker/controller 节点 2。
  # 本地通过 localhost:29092 访问；容器网络内通过 kafka-2:9092 访问。
  kafka-2:
    image: apache/kafka:3.7.1
    container_name: mlc-kafka-2
    ports:
      # 宿主机端口:容器端口；Go 服务在本机运行时使用 localhost:29092。
      - "29092:29092"
    environment:
      # 使用 KRaft 模式，不再依赖 ZooKeeper。
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # 每个 KRaft 节点必须有唯一 node id，且要和 controller quorum voters 中的 id 对应。
      KAFKA_NODE_ID: 2
      # broker 负责读写消息，controller 负责集群元数据选主和管理。
      KAFKA_PROCESS_ROLES: broker,controller
      # 三节点 controller quorum；格式为 nodeId@host:controllerPort。
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      # 9092 对外提供普通 Kafka 协议，9093 仅供 controller quorum 内部通信。
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      # 每个 broker 必须广告自己的宿主机映射端口，否则客户端元数据刷新后会连错节点。
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
      # 本地开发使用明文协议；生产环境应替换为 SASL_SSL/SSL。
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 指定 controller 监听器名称，必须与 LISTENERS 中的 CONTROLLER 一致。
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 本地开发允许自动建 topic，生产环境建议关闭并用迁移脚本显式创建。
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    volumes:
      # 持久化 broker 数据，避免容器重启后 topic 和 offset 丢失。
      - kafka_2_data:/var/lib/kafka/data

  # Kafka broker/controller 节点 3。
  # 本地通过 localhost:39092 访问；容器网络内通过 kafka-3:9092 访问。
  kafka-3:
    image: apache/kafka:3.7.1
    container_name: mlc-kafka-3
    ports:
      # 宿主机端口:容器端口；Go 服务在本机运行时使用 localhost:39092。
      - "39092:39092"
    environment:
      # 使用 KRaft 模式，不再依赖 ZooKeeper。
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # 每个 KRaft 节点必须有唯一 node id，且要和 controller quorum voters 中的 id 对应。
      KAFKA_NODE_ID: 3
      # broker 负责读写消息，controller 负责集群元数据选主和管理。
      KAFKA_PROCESS_ROLES: broker,controller
      # 三节点 controller quorum；格式为 nodeId@host:controllerPort。
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      # 9092 对外提供普通 Kafka 协议，9093 仅供 controller quorum 内部通信。
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39092,CONTROLLER://:9093
      # 第三个 broker 的宿主机访问地址。
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092
      # 本地开发使用明文协议；生产环境应替换为 SASL_SSL/SSL。
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 指定 controller 监听器名称，必须与 LISTENERS 中的 CONTROLLER 一致。
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 本地开发允许自动建 topic，生产环境建议关闭并用迁移脚本显式创建。
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    volumes:
      # 持久化 broker 数据，避免容器重启后 topic 和 offset 丢失。
      - kafka_3_data:/var/lib/kafka/data

  # Kafka UI，用于本地查看 topic、consumer group、消息和 broker 状态。
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mlc-kafka-ui
    ports:
      # 浏览器访问 http://localhost:18080。
      - "18080:8080"
    environment:
      # UI 中展示的集群名称。
      KAFKA_CLUSTERS_0_NAME: mlc-local
      # UI 运行在 compose 网络内，因此使用容器内地址 kafka-x:9092。
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    container_name: mlc-clickhouse
    ports:
      - "18123:8123"
    environment:
      CLICKHOUSE_DB: mlc
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse/001_statistic_events.sql:/docker-entrypoint-initdb.d/001_statistic_events.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Statistic 本地全链路验收专用 Redis，与 debug 默认 6379 端口隔离。
  redis-statistic:
    image: redis:7.4.2-alpine
    container_name: mlc-redis-statistic
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_statistic_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Prometheus 监控服务预留。
  # 当前 compose 只启动服务和端口，采集 Kafka/Grafana 指标还需要补 prometheus.yml。
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mlc-prometheus
    ports:
      # 浏览器访问 http://localhost:19090。
      - "19090:9090"
    extra_hosts:
      # Linux Docker 也可通过同一名称抓取宿主机上的应用管理端口。
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: mlc-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "19093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets:
      - alertmanager_webhook_url

  # Grafana 可视化服务预留。
  # 初始账号通常为 admin/admin，首次登录后按提示修改密码。
  grafana:
    image: grafana/grafana:11.2.2
    container_name: mlc-grafana
    ports:
      # 浏览器访问 http://localhost:13000。
      - "13000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

volumes:
  # 三个 broker 使用独立数据卷，避免节点数据互相覆盖。
  # 如需彻底清空本地 Kafka 数据，可停止 compose 后删除这些 volume；删除后 topic、消息和 consumer offset 都会丢失。
  kafka_1_data:
  # kafka-2 的持久化数据卷。
  kafka_2_data:
  # kafka-3 的持久化数据卷。
  kafka_3_data:
  prometheus_data:
  grafana_data:
  clickhouse_data:
  redis_statistic_data:

secrets:
  alertmanager_webhook_url:
    file: ${ALERTMANAGER_WEBHOOK_URL_FILE:-./monitoring/secrets/alertmanager_webhook_url}
