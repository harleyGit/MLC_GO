name: Business error contracts

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true
      - name: Preserve previously published definitions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA:docs/error-codes.v1.json" 2>/dev/null; then
            git show "$BASE_SHA:docs/error-codes.v1.json" > "$RUNNER_TEMP/error-codes.baseline.json"
            go run ./cmd/hg_error_catalog -baseline "$RUNNER_TEMP/error-codes.baseline.json" > /dev/null
          fi
      - name: Validate published dictionary, HTTP and Kafka contracts
        run: >-
          go test -tags production ./cmd/hg_error_catalog ./internal/response/...
          ./internal/pkg/kafka ./internal/pkg/middleware ./internal/pkg/hg_router
          ./internal/modules/user/middleware ./internal/modules/im ./internal/modules/commerce
          ./internal/modules/product ./internal/consumer/danmaku -count=1
      - name: Race detection
        run: >-
          go test -race -tags production ./internal/response/... ./internal/pkg/kafka
          ./internal/pkg/middleware ./internal/pkg/hg_router ./internal/modules/im
          ./internal/modules/commerce ./internal/consumer/danmaku -count=1
      - name: Static analysis
        run: >-
          go vet -tags production . ./cmd/hg_error_catalog ./internal/response/...
          ./internal/modules/... ./internal/pkg/hg_response ./internal/pkg/hg_router
          ./internal/pkg/middleware ./internal/pkg/kafka ./internal/pkg/idgen
          ./internal/pkg/trace ./internal/outbox ./internal/consumer/danmaku ./migrations
      - name: Build production entry
        run: go build -tags production -o "$RUNNER_TEMP/mlc-go" .
