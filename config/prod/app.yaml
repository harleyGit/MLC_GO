server:
  port: 80

video_danmaku:
  # 部署必须通过 VIDEO_DANMAKU_ALLOWED_ORIGINS 覆盖实际 Web 站点 Origin；gnet 会精确匹配白名单。
  allowed_origins:
    - https://www.example.com

coin_jobs:
  # 生产首次启用只处理 1 个钱包、每钱包最多锁 4 个 source lots。
  consolidation_batch_size: 1
  consolidation_source_limit: 4
  consolidation_max_lot_amount: 10

video_comment:
  # 这里填写“允许替客户端转发真实 IP”的负载均衡、Ingress 或 Nginx 所在网段。
  # 只有请求的直接来源位于这些网段时，程序才会读取 X-Forwarded-For/X-Real-IP。
  # 10.20.0.0/16 表示 10.20.0.0 到 10.20.255.255；10.30.0.0/16 同理。
  # 不要填写 0.0.0.0/0 或 ::/0，否则任何客户端都可能伪造来源 IP 绕过按 IP 限流。
  trusted_proxy_cidrs:
    - 10.20.0.0/16
    - 10.30.0.0/16
  storage:
    type: s3
    # endpoint/region/bucket/CDN 和访问凭据均由 VIDEO_COMMENT_* 环境变量注入。
    endpoint: ""
    region: ""
    bucket: ""
    cdn_base_url: ""
