kafka:
  business:
    # 部署前替换为生产 Kafka 的内网 DNS；所有 advertised.listeners 必须对应用可达。
    brokers:
      - localhost:19092
      - localhost:29092
      - localhost:39092
    retry: 5
    client_id: mlc-go-prod-business
    topics:
      - mlc.domain.events
    consumers:
      feed:
        # Feed 已使用 Redis Lua 原子完成 EventID 幂等、ZSET 写入和容量裁剪，可独立启用。
        enabled: true
        group_id: mlc-go-prod-feed
        client_id: mlc-go-prod-feed
      search:
        # 依赖 ES/OpenSearch mapping、批量客户端和失败补偿存储，契约完成前保持关闭。
        enabled: false
        group_id: mlc-go-prod-search
        client_id: mlc-go-prod-search
      statistic:
        # 已具备 Redis Lua 原子幂等计数，但按灰度顺序先只观察 Feed，避免同时启用多个新读模型扩大风险。
        enabled: false
        group_id: mlc-go-prod-statistic
        client_id: mlc-go-prod-statistic
      audit:
        # 审核接口的超时、重试、幂等键和限流契约未完成，禁止启用。
        enabled: false
        group_id: mlc-go-prod-audit
        client_id: mlc-go-prod-audit
  log:
    # 建议与业务集群做物理隔离或至少设置独立资源配额。
    brokers:
      - localhost:19092
      - localhost:29092
      - localhost:39092
    retry: 3
    client_id: mlc-go-prod-log
