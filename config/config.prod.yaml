server:
  port: 80
log:
  level: info
db:
  dsn: root:******@tcp(prod-db:3306)/prod
kafka:
  # business 是生产业务事件集群，应用启动时必须完成配置校验并成功 Ping 任一 broker，否则服务拒绝启动。
  business:
    # 当前地址对应本项目本机 Compose 三节点端口，仅适用于服务与 Kafka 位于同一宿主机的部署方式。
    # 正式生产部署前必须替换为生产 Kafka 的真实内网 DNS/IP:port，且所有 advertised.listeners 必须能被应用实例访问。
    brokers:
      - localhost:19092
      - localhost:29092
      - localhost:39092
    # all 表示等待 ISR 副本全部确认，生产业务事件以可靠性优先。
    acks: all
    # 生产业务消息最多进行五次客户端重试；仍需结合业务幂等键、Outbox 或去重机制处理重复投递。
    retry: 5
    # broker 日志和指标中的生产业务客户端标识，用于连接数、吞吐和错误率归因。
    client_id: mlc-go-prod-business
  # log 为生产日志/埋点集群配置，建议生产环境最终与 business 做物理集群或资源配额隔离。
  log:
    # 当前暂与 business 共用本机 Compose 地址；正式生产部署必须替换为生产日志集群的真实可达地址。
    brokers:
      - localhost:19092
      - localhost:29092
      - localhost:39092
    # "1" 表示只等待 leader 确认，以吞吐和低延迟优先；允许在 broker 故障窗口承担少量日志丢失风险。
    acks: "1"
    # 日志消息最多重试三次，避免无限重试导致缓冲堆积和进程内存压力。
    retry: 3
    # broker 日志和指标中的生产日志客户端标识，便于与核心业务流量分开观测。
    client_id: mlc-go-prod-log
