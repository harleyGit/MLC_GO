server:
  # debug 和 pre 的默认监听端口；prod 在环境配置中覆盖。
  port: 8080

management:
  # 管理端口仅承载 healthz、readyz 和 metrics，生产网络策略不得向公网暴露。
  host: 127.0.0.1
  port: 9091

video_danmaku:
  # gnet 使用独立内部端口；生产由 Ingress 将 /api/v1/video_danmaku/ws 转发到该端口并终止 TLS。
  host: 0.0.0.0
  port: 8081
  allowed_origins:
    - http://localhost:5174
  ticket_ttl: 45s
  worker_count: 16
  queue_size: 65536
  max_connections: 1000000
  max_frame_bytes: 4096
  max_handshake_bytes: 8192
  # 顶层房间和热门房间成员分别分片，广播不会持有跨视频全局锁或创建全房间临时快照。
  room_shard_count: 256
  member_shard_count: 64
  # 慢客户端超过该出站积压即主动断开，防止热门房间广播堆积耗尽进程内存。
  max_pending_bytes: 65536
  # 单连接创建命令令牌桶；控制帧和服务端广播不受该限制。
  command_rate_per_second: 5
  command_burst: 10

interaction_reproject:
  enabled: true
  interval: 1m
  timeout: 20s
  safety_lag: 5s
  lease_ttl: 30s
  page_size: 500
  # 固定 bucket 范围可拆分到不同副本；默认全范围单 worker 保持原行为。
  worker_count: 1
  hash_ranges:
    - start: 0
      end: 1024

coin_jobs:
  enabled: true
  interval: 1m
  timeout: 20s
  batch_size: 200
  # 0 表示默认关闭 lot consolidation；启用前需在环境配置中同时设置下面三个有界参数。
  consolidation_batch_size: 0
  consolidation_source_limit: 32
  consolidation_max_lot_amount: 10

correction_recovery:
  enabled: true
  interval: 1m
  timeout: 10s
  # approving 持续 5 分钟后才进入幂等恢复，避开仍在执行的正常审批请求。
  approving_timeout: 5m
  batch_size: 20

video_comment:
  # 仅当直连来源命中这些 CIDR 时才信任 X-Forwarded-For/X-Real-IP；生产也可用 VIDEO_COMMENT_TRUSTED_PROXY_CIDRS 逗号分隔覆盖。
  trusted_proxy_cidrs: []
  storage:
    type: local
    endpoint: ""
    region: ""
    bucket: ""
    cdn_base_url: "http://localhost:8080/uploads"
    request_timeout: 10s
  image:
    user_capacity_bytes: 524288000
    rate_user_capacity: 6
    rate_ip_capacity: 30
    rate_window: 1m
  maintenance:
    enabled: true
    interval: 1m
    timeout: 30s
    orphan_age: 24h
    batch_size: 100
