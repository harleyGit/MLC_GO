kafka:
  business:
    # 仅适用于服务与 Kafka 位于同一宿主机的预发布验证环境。
    brokers:
      - localhost:19092
      - localhost:29092
      - localhost:39092
    retry: 3
    client_id: mlc-go-pre-business
    topics:
      - mlc.domain.events
    consumers:
      feed:
        # Feed v2 使用 64 分片 ZSET 和 Kafka partition offset 水位，避免全局热 key 与 EventID TTL 失效。
        enabled: true
        group_id: mlc-go-pre-feed
        client_id: mlc-go-pre-feed
      search:
        # 依赖 ES/OpenSearch mapping、批量客户端和失败补偿存储，契约完成前保持关闭。
        enabled: false
        group_id: mlc-go-pre-search
        client_id: mlc-go-pre-search
      statistic:
        # 代码已使用分片 offset 水位永久幂等；完成 ClickHouse 权威数据对账与告警验收后再灰度启用。
        enabled: false
        group_id: mlc-go-pre-statistic
        client_id: mlc-go-pre-statistic
      audit:
        # 审核接口的超时、重试、幂等键和限流契约未完成，禁止启用。
        enabled: false
        group_id: mlc-go-pre-audit
        client_id: mlc-go-pre-audit
  log:
    brokers:
      - localhost:19092
      - localhost:29092
      - localhost:39092
    retry: 1
    client_id: mlc-go-pre-log
