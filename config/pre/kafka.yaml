kafka:
  business:
    # 仅适用于服务与 Kafka 位于同一宿主机的预发布验证环境。
    brokers:
      - localhost:19092
      - localhost:29092
      - localhost:39092
    retry: 3
    client_id: mlc-go-pre-business
    topics:
      - mlc.domain.events
    consumers:
      feed:
        # Feed 已使用 Redis Lua 原子完成 EventID 幂等、ZSET 写入和容量裁剪，可独立启用。
        enabled: true
        group_id: mlc-go-pre-feed
        client_id: mlc-go-pre-feed
      search:
        # 依赖 ES/OpenSearch mapping、批量客户端和失败补偿存储，契约完成前保持关闭。
        enabled: false
        group_id: mlc-go-pre-search
        client_id: mlc-go-pre-search
      statistic:
        # 已具备 Redis Lua 原子幂等计数，但按灰度顺序先只观察 Feed，避免同时启用多个新读模型扩大风险。
        enabled: false
        group_id: mlc-go-pre-statistic
        client_id: mlc-go-pre-statistic
      audit:
        # 审核接口的超时、重试、幂等键和限流契约未完成，禁止启用。
        enabled: false
        group_id: mlc-go-pre-audit
        client_id: mlc-go-pre-audit
  log:
    brokers:
      - localhost:19092
      - localhost:29092
      - localhost:39092
    retry: 1
    client_id: mlc-go-pre-log
